name: pre-commit autoupdate for template

on:
  push:
    branches:
      - pre-commit-ci-update-config

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for stefanzweifel/git-auto-commit-action
    if: ${{ github.actor == 'pre-commit-ci[bot]' }} # zizmor: ignore[bot-conditions] -- action does not run in privileged context (e.g. pull_request_target) and does not execute any user-provided code
    steps:
      - name: Generate tokens
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PR_CREATOR_APP_ID }}
          private-key: ${{ secrets.PR_CREATOR_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # used by push action
      - run: pipx install prek
        # need to explicitly specify config file since prek ignores cookiecutter directories by default: https://github.com/j178/prek/issues/1044
      - run: cd '{{cookiecutter.project_name}}' && prek autoupdate -c .pre-commit-config.yaml
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
